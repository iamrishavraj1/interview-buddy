name: Feature request
description: Suggest an improvement to the app, setup flow, docs, or developer experience.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share the user problem first. The best features make offline speaking practice easier, faster, or more useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Before opening
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This keeps YourSpeakReps local/offline by default.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult, slow, missing, or confusing today?
      placeholder: "As a user, I want..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional, but useful if there are tradeoffs.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What should be true when this is done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
